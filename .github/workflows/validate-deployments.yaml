name: Validate Deployment methods

on:
  push:
    branches:
      - master
    paths:
      - "charts/ext-postgres-operator/**"
      - "config/**"
      - "hack/test-helm-crds*"
      - ".github/workflows/validate-deployments.yaml"
  pull_request:
    branches:
      - master
    paths:
      - "charts/ext-postgres-operator/**"
      - "config/**"
      - "hack/test-helm-crds*"
      - ".github/workflows/validate-deployments.yaml"

jobs:
  validate-helm:
    name: Validate Helm Chart
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        helm: ["v3.18.2", "v4.2.3"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: ${{ matrix.helm }}

      - name: Lint Helm chart
        run: helm lint ./charts/ext-postgres-operator

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install chart test dependencies
        run: python -m pip install PyYAML==6.0.3

      - name: Verify CRD rendering and packaging
        run: python hack/test-helm-crds.py

      - uses: actions/setup-go@v7
        with:
          go-version: "stable"

      - name: Set up kubectl
        uses: marcofranssen/setup-kubectl@v3.0.0

      - name: Install kind
        run: go install sigs.k8s.io/kind@v0.32.0

      - name: Verify CRD upgrade and retention in a disposable cluster
        run: bash hack/test-helm-crds-lifecycle.sh

  validate-kustomize:
    name: Validate Kustomize Configuration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Validate Kustomize configuration
        run: kustomize build ./config/default > /dev/null
